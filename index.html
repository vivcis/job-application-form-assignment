<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
            padding: 40px;
            width: 100%;
            max-width: 720px;
        }

        h1 {
            text-align: center;
            color: #1a1a2e;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 16px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        label .required {
            color: #e74c3c;
            margin-left: 2px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fafafa;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #2c3e50;
            box-shadow: 0 0 0 3px rgba(44, 62, 80, 0.1);
            background: #fff;
        }

        input[type="file"] {
            padding: 8px;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #2c3e50;
            margin: 28px 0 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid #ecf0f1;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 24px;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background: #1a252f;
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .alert {
            padding: 14px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 600px) {
            .form-row { flex-direction: column; gap: 0; }
            .container { padding: 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Job Application</h1>
        <p class="subtitle">Please fill in all required fields to submit your application.</p>

        <div id="alert-success" class="alert alert-success">Application submitted successfully!</div>
        <div id="alert-error" class="alert alert-error">Something went wrong. Please try again.</div>

        <form id="applicationForm" action="saveRecord.php" method="POST" enctype="multipart/form-data">

            <!-- Personal Information -->
            <div class="section-title">Personal Information</div>

            <div class="form-group">
                <label for="applicant_name">Full Name <span class="required">*</span></label>
                <input type="text" id="applicant_name" name="applicant_name" placeholder="Enter your full name" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="ssn">Social Security Number <span class="required">*</span></label>
                    <input type="text" id="ssn" name="ssn" required pattern="[0-9]{3}-[0-9]{2}-[0-9]{4}" placeholder="XXX-XX-XXXX">
                </div>
                <div class="form-group">
                    <label for="gender">Gender <span class="required">*</span></label>
                    <select id="gender" name="gender" required>
                        <option value="">-- Select --</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                        <option value="Prefer not to say">Prefer not to say</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="dob">Date of Birth <span class="required">*</span></label>
                    <input type="date" id="dob" name="dob" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address <span class="required">*</span></label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="phone">Phone Contact <span class="required">*</span></label>
                <input type="tel" id="phone" name="phone" placeholder="+1 (555) 123-4567" required>
            </div>

            <!-- Address Information -->
            <div class="section-title">Address &amp; Location</div>

            <div class="form-group">
                <label for="address">Residential Address <span class="required">*</span></label>
                <textarea id="address" name="address" rows="3" placeholder="Street address, city, state, ZIP" required></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="country_residence">Country of Residence <span class="required">*</span></label>
                    <input type="text" id="country_residence" name="country_residence" placeholder="e.g. United States" required>
                </div>
                <div class="form-group">
                    <label for="country_birth">Country of Birth <span class="required">*</span></label>
                    <input type="text" id="country_birth" name="country_birth" placeholder="e.g. Nigeria" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="county_residence">County of Residence <span class="required">*</span></label>
                    <input type="text" id="county_residence" name="county_residence" placeholder="e.g. Los Angeles" required>
                </div>
                <div class="form-group">
                    <label for="county_birth">County of Birth <span class="required">*</span></label>
                    <input type="text" id="county_birth" name="county_birth" placeholder="e.g. Lagos" required>
                </div>
            </div>

            <!-- Job Details -->
            <div class="section-title">Application Details</div>

            <div class="form-group">
                <label for="job_type">Type of Job Applying For <span class="required">*</span></label>
                <select id="job_type" name="job_type" required>
                    <option value="">-- Select Job Type --</option>
                    <option value="Full-Time">Full-Time</option>
                    <option value="Part-Time">Part-Time</option>
                    <option value="Contract">Contract</option>
                    <option value="Internship">Internship</option>
                    <option value="Remote">Remote</option>
                </select>
            </div>

            <div class="form-group">
                <label for="resume">Upload Resume <span class="required">*</span></label>
                <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required>
            </div>

            <button type="submit" class="btn-submit">Submit Application</button>
        </form>
    </div>
</body>
</html>
